[project]
name = "rolig-backend"
version = "0.1.0"
description = "Async FastAPI backend for Rolig"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "openai>=1.99,<3",
    "pydantic-settings>=2.10,<3",
    "redis>=6.2,<7",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
